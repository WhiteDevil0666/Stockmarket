# .github/workflows/daily_update.yml
# ------------------------------------
# Runs every weekday at 6:30 AM IST (1:00 AM UTC).
# Uses GitHub Actions FREE tier (2000 min/month — we use ~300).
#
# After predictions are generated, it commits the CSV back to the repo.
# Streamlit Cloud reads from the repo, so the dashboard auto-refreshes.

name: Daily Stock Prediction Update

on:
  schedule:
    - cron: '0 1 * * 1-5'   # Mon–Fri at 01:00 UTC = 06:30 AM IST
  workflow_dispatch:         # also allows manual trigger from Actions tab

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily update
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python update_data.py

      - name: Commit predictions back to repo
        run: |
          git config --global user.name  "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add predictions/
          git diff --staged --quiet || git commit -m "🤖 Daily predictions: $(date +'%Y-%m-%d')"
          git push
